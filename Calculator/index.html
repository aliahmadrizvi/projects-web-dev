<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            padding: 29px;
            background-color: bisque;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center ;
            align-items: center;
        }
        .calculatorContainer{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 70vw;
            border: 2px solid black;
            height: 80vh;

            


        }
        .userValue{
            display: flex;
            padding: 2rem;
            justify-content: center;
            align-items: center;
        }
        .userValue input{
            font-family:'Times New Roman', Times, serif45;
            width: 23rem;
            height: 4rem;
            font-size: 3rem;
        }
        .box{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 3rem;
            font-weight: 900;
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border: 2px solid black;
        }
        .calculatorFuncton{
            border: 2px solid black;
            display: grid;
            justify-content: center;
            padding:1rem;
            width: 20rem;
            align-items: center;
            row-gap: 2px;
            column-gap: 13px;
            grid-template-columns: auto auto auto auto;
            
        
        }

    </style>
</head>
<body>
    <div class="calculatorContainer">
        <div class="userValue">
        <input type="text">
        </div>
        <div class="calculatorFuncton">
            <div class="box">ac</div>
            <div class="box">()</div>
            <div class="box">%</div>
            <div class="box">/</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
            <div class="box">X</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">-</div>
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
             <div class="box">+</div>
            <div class="box">0</div>
            <div class="box">.</div>
            <div class="box">C</div>
            <div class="box">=</div>
        </div>
    </div>
</body>
</html>
