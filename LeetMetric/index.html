<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LeetMetric</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <!-- Header -->
        <h1>LeetMetric</h1>


        <!-- Username Section -->
        <div class="user-container">

            <p>Enter your username below</p>

            <div class="user-input-container">

                <input
                    type="text"
                    placeholder="Enter your username here"
                    id="user-input"
                >

                <button id="search-btn">
                    Search
                </button>

            </div>

        </div>


        <!-- Statistics -->
        <div class="stats-container">

            <!-- Progress Circles -->
            <div class="progress">

                <!-- Easy -->
                <div class="progress-item">

                    <div class="circle easy-progress">

                        <span id="easy-label">
                            0/0
                        </span>

                    </div>

                    <p>Easy</p>

                </div>


                <!-- Medium -->
                <div class="progress-item">

                    <div class="circle medium-progress">

                        <span id="medium-label">
                            0/0
                        </span>

                    </div>

                    <p>Medium</p>

                </div>


                <!-- Hard -->
                <div class="progress-item">

                    <div class="circle hard-progress">

                        <span id="hard-label">
                            0/0
                        </span>

                    </div>

                    <p>Hard</p>

                </div>

            </div>


            <!-- Submission Cards -->
            <div class="stats-cards">

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
