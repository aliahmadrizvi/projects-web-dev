<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To - Do List </title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        height: 100%;
        width: 100%;
        background: linear-gradient(135deg,black,white);
    }
    .main{
        display: flex;
        justify-content: center;
        

    }
    .container{
      
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
        width: 80%;  
    }
    .container-header{
        padding: 1rem;
        border-radius: 2rem;
        margin: 2rem;
       

    }
    .headertext{
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 63px;
        color: bisque;

    }
    .container-body{
        display: flex;
        flex-direction: column;
        align-items: center;
        ;
        height: auto;
        min-height: 600px;
        width: 50%;
        border-radius: 3rem;
    }
    .userlist{
        display: flex;
        
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 3rem;
       
       height:20%;
       border-radius: 2rem ;
       width:70%;
       padding: 0.5rem;

    }
  #imp{
    border: none;
    border-radius: 2rem ;
    transition: transform 0.2s ease;
    padding: 0.76rem 2rem;
    }
    #imp:focus{
        outline: none;
        transform: scale(1.03);

    }
   
    
    .btnAdd{ 
    border: none;
    background-color: yellow;
    border-radius: 1rem ;
    padding: 0.5rem 1rem;
    transition:all 0.3s ease ;

    }
    .change{
        text-decoration: line-through;
        opacity: 0.5;
    }
    .btnAdd:hover{
        background: rgb(136, 136, 25);
    }
    .todoCards{
        width:80%;
        border-radius: 1rem ;
       
        margin-top: 1.5rem;
        height: auto;
    }
    .card{
        display: flex;
        justify-content:space-around;
        align-items: center;
        gap: 2rem;
       background: linear-gradient(90deg, #dffff4, #10221d);
       height:20%;
       margin: 2rem auto;
       border-radius: 2rem ;
       width:80%;
       padding: 0.5rem;

    }
    @media (max-width: 768px) {

    .container {
        width: 95%;
    }

    .container-header {
        margin: 1.5rem;
        padding: 0.8rem 1.2rem;
    }

    .headertext {
        font-size: 40px;
    }

    .container-body {
        width: 90%;
        min-height: 500px;
        border-radius: 2rem;
    }

    .userlist {
        width: 90%;
        height: auto;
        margin-top: 2rem;
        padding: 1rem;
        gap: 10px;
    }

    #imp {
        width: 65%;
        padding: 0.7rem 1rem;
    }

    .userlist .btnAdd {
        padding: 0.7rem 1rem;
    }

    .todoCards {
        width: 95%;
    }

    .card {
        width: 95%;
        min-height: 55px;
        height: auto;
        margin: 1rem auto;
        gap: 1rem;
        padding: 0.8rem 1rem;
    }

    .card span {
        flex: 1;
        word-break: break-word;
    }
}
    @media (max-width: 480px) {

    .headertext {
        font-size: 30px;
    }

    .container-header {
        border-radius: 1.5rem;
    }

    .container-body {
        width: 95%;
    }

    .userlist {
        width: 92%;
    }

    #imp {
        width: 60%;
        padding: 0.65rem 0.8rem;
    }

    .card {
        width: 95%;
        gap: 0.6rem;
        font-size: 14px;
    }

    .card .btnAdd {
        padding: 0.4rem 0.7rem;
        font-size: 12px;
    }
}
    


    

</style>
<body>
    <div class="main">
        <div class="container">
            <div class="container-header">
                <h1 class="headertext">To - Do List</h1>

            </div>
            <div class="container-body">
                <div class="userlist">
                    <input type="text" placeholder="Wrtie the your todo things.." id="imp">
                    <button class="btnAdd">Add</button>
                </div>
                <div class="todoCards">
                    <!-- card1  -->
                     


                </div>
            </div>
        </div>


    </div>
    <script>
        let main = document.querySelector(".main");
        let container = document.querySelector(".container");
        let containerBody=document.querySelector(".container-body");
        let cardConatiner = document.querySelector(".todoCards");
        let card = document.querySelector(".card");
        let taskinp = document.querySelector("input");
        let btnAdd=document.querySelector(".btnAdd");

        btnAdd.addEventListener('click',function(dets){
            if(taskinp.value !==""){
                let card = document.createElement('div');
            card.classList.add("card");

            let inp = document.createElement('input');
           
            
            inp.setAttribute('type', 'checkbox');
            
            let span = document.createElement('span');
            span.textContent=taskinp.value;
            let btnDel=document.createElement('button');
            btnDel.textContent="Delete";
            btnDel.classList.add('btnAdd');
             inp.addEventListener("change", function () {
    span.classList.toggle("change");
});
            btnDel.addEventListener('click',function(dets){
                btnDel.parentElement.remove();

        });


            card.appendChild(inp);
            card.appendChild(span);
            card.appendChild(btnDel);

            cardConatiner.appendChild(card);  
            }
            
        });
       

        
    </script>
</body>
</html>
